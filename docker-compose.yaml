services:
  libms_db:
    image: postgres:15-alpine
    container_name: libms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: libms
    ports:
      - "5432:5432"
    volumes:
      - django_libms_data:/var/lib/postgresql/data
    networks:
      - libms_network
  pgadmin:
    image: dpage/pgadmin4
    container_name: Django_libms_pgadmin
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
      - "5051:443"
    depends_on:
      - libms_db
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - libms_network
volumes:
  django_libms_data:
  pgadmin:

networks:
  libms_network:
    driver: bridge
